<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movi Fisio</title>
<style>
:root{--bg:#f6f8fc;--sf:#fff;--tx:#14213d;--mu:#5b6785;--pr:#0b4fa8;--p2:#e8f0fd;--ac:#ff8a3d;--bd:#dde4f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--sf:#151e33;--tx:#e8eefc;--mu:#9aa8c7;--pr:#6aa8ff;--p2:#1b2a4a;--bd:#25324f}}
:root[data-theme="dark"]{--bg:#0d1424;--sf:#151e33;--tx:#e8eefc;--mu:#9aa8c7;--pr:#6aa8ff;--p2:#1b2a4a;--bd:#25324f}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:860px;margin:auto;padding:16px}h1{font-size:22px;margin:0}h2{font-size:20px;margin:.2em 0 .6em}h3{font-size:16px;margin:.4em 0}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.rl{background:var(--p2);color:var(--pr);padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}nav button,.b{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 14px;border-radius:99px;cursor:pointer;font-size:14px}
nav button.on,.b.p{background:var(--pr);color:#fff;border-color:var(--pr)}.b.d{border-color:#dc2626;color:#dc2626}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}.mut{color:var(--mu);font-size:13.5px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font-size:15px}
.opt.ok{background:#16a34a33;border-color:#16a34a}.opt.no{background:#dc262633;border-color:#dc2626}
input,select,textarea{width:100%;padding:10px 12px;margin:4px 0 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox],input[type=radio]{width:auto;margin-right:8px}.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14.5px}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:10px;border-radius:5px;background:var(--p2);overflow:hidden;margin:2px 0 10px}.bar i{display:block;height:100%;background:var(--pr)}
@media print{nav,header .b,.np{display:none}body{background:#fff;color:#000}}
body{background:linear-gradient(180deg,var(--p2),var(--bg) 380px) no-repeat}
.hero{background:linear-gradient(135deg,#0b4fa8,#1a7fd1 60%,#2bb5a8);color:#fff;border-radius:22px;padding:14px 22px 0;justify-content:flex-start;align-items:flex-end;flex-wrap:nowrap;overflow:hidden;box-shadow:0 10px 28px #0b4fa83d}
.hero img{height:150px;width:auto;flex:none;filter:drop-shadow(0 6px 8px #0005)}.hero div{padding-bottom:18px}.hero h1{font-size:28px}.hero p{margin:.2em 0 .7em;opacity:.93}.hero .rl{background:#ffffff2e;color:#fff}
.card{box-shadow:0 4px 16px #0b4fa81a;border-top:4px solid var(--ac)}nav button{box-shadow:0 2px 6px #0b4fa81a}.b.p{background:var(--ac);color:#1b1200;border-color:var(--ac);font-weight:700}
.opt:hover:not(:disabled){border-color:var(--pr);background:var(--p2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}.tile{border-radius:16px;padding:14px;color:#fff;font-size:13.5px}.tile b{display:block;font-size:28px;line-height:1.1}
.tile:nth-child(1){background:linear-gradient(135deg,#ff8a3d,#ffb347);color:#2a1500}.tile:nth-child(2){background:linear-gradient(135deg,#0b4fa8,#1a7fd1)}.tile:nth-child(3){background:linear-gradient(135deg,#16a34a,#4ade80);color:#052e16}.tile:nth-child(4){background:linear-gradient(135deg,#e11d48,#fb7185)}
@media(max-width:520px){.hero img{height:110px}.hero h1{font-size:22px}}

function quiz(el,pool,ev){let i=0,ok=0;const run=()=>{el.innerHTML="";if(i>=pool.length){loadA();return el.append(E("p","",`<b>Concluído: ${ok}/${pool.length}</b> 🎉 Movi: constância é a chave!`))}

  const{data,error}=await SB.rpc("responder",{p_question:q.id,p_escolhida:k,p_event:ev||null});if(error){bs.forEach(x=>x.disabled=0);return alert(error.message)}

  const d=E("div","","<p>💡 "+esc(data.explicacao||"")+"</p>");const nx=E("button","b p",i+1<pool.length?"Próxima":"Concluir");nx.onclick=()=>{i++;run()};d.append(nx);el.append(d)};el.append(b)})};run()}
